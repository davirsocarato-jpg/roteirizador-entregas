<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roteirizador de Entregas</title>
    <meta
      name="description"
      content="Roteirizador de entregas para uso no dia a dia em navegador web e celular."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Operação diária</p>
          <h1>Roteirizador de Entregas</h1>
        </div>
        <button id="resetDataBtn" class="button ghost" type="button">Limpar dados</button>
      </header>

      <main class="layout">
        <aside class="panel form-panel">
          <h2>Nova entrega</h2>

          <form id="deliveryForm">
            <div class="field">
              <label for="clientName">Cliente</label>
              <input id="clientName" name="clientName" type="text" placeholder="Ex.: Padaria São Luiz" required />
            </div>

            <div class="field">
              <label for="address">Endereço</label>
              <input id="address" name="address" type="text" placeholder="Ex.: Rua das Flores, 123" required />
            </div>

            <div class="two-col">
              <div class="field">
                <label for="latitude">Latitude</label>
                <input id="latitude" name="latitude" type="number" step="0.000001" value="-23.5505" required />
              </div>

              <div class="field">
                <label for="longitude">Longitude</label>
                <input id="longitude" name="longitude" type="number" step="0.000001" value="-46.6333" required />
              </div>
            </div>

            <div class="two-col">
              <div class="field">
                <label for="duration">Tempo estimado</label>
                <input id="duration" name="duration" type="number" min="5" max="180" value="20" required />
              </div>

              <div class="field">
                <label for="priority">Prioridade</label>
                <select id="priority" name="priority">
                  <option value="Alta">Alta</option>
                  <option value="Média" selected>Média</option>
                  <option value="Baixa">Baixa</option>
                </select>
              </div>
            </div>

            <div class="actions">
              <button class="button primary" type="submit">Adicionar entrega</button>
              <button id="optimizeBtn" class="button success" type="button">Organizar rota</button>
            </div>
          </form>
        </aside>

        <section class="panel content-panel">
          <div class="stats">
            <div class="stat-card">
              <span class="label">Entregas</span>
              <strong id="totalStops">0</strong>
            </div>
            <div class="stat-card">
              <span class="label">Distância</span>
              <strong id="totalDistance">0 km</strong>
            </div>
            <div class="stat-card">
              <span class="label">Tempo</span>
              <strong id="totalTime">0 min</strong>
            </div>
          </div>

          <div class="section-head">
            <h2>Rota recomendada</h2>
          </div>

          <ul id="routeList" class="route-list" aria-live="polite"></ul>

          <div class="section-head">
            <h2>Entregas cadastradas</h2>
          </div>
          <ul id="deliveryList" class="delivery-list"></ul>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
